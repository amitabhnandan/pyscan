  ### MCP / Agent Tools ([N] total)
  | File | Line | Tool Name | What It Can Do |
  |------|------|-----------|----------------|

  ### Chat, Bot, and Webhook Handlers ([N] total)
  | File | Line | Event/Command | Auth Required? |
  |------|------|---------------|---------------|

  ### Message-Driven ([N] total)
  | File | Line | Type | Queue/Topic |
  |------|------|------|-------------|

  ### Scheduled/Batch ([N] total)
  | File | Line | Schedule | Runs As |
  |------|------|---------|---------|

  ---

  ## Dangerous Sinks
  ### Deserialisation ([N] instances)
  | File | Line | Type | Nearest Entry Point |
  |------|------|------|-------------------|
  | [path] | [N] | pickle.loads | [entry point file] |

  ### XML Processing ([N] instances)
  | File | Line | Factory Type | XXE Protected? |
  |------|------|-------------|---------------|

  ### Database Execution ([N] instances)
  | File | Line | Type | String Concatenation? |
  |------|------|------|---------------------|

  ### Command Execution ([N] instances)
  | File | Line | Type | Input Source |
  |------|------|------|-------------|

  ### Cryptography ([N] instances)
  | File | Line | Algorithm | Weak? |
  |------|------|-----------|-------|

  ---

  ## Trust Boundary Analysis

  ### Unauthenticated → Authenticated boundary
  Files where auth checks occur:
  [list of files with auth enforcement]

  Potential bypass candidates (entry points with no nearby auth check):
  [list of entry points where auth enforcement was NOT found nearby]

  ### High-value paths (entry point → dangerous sink, no auth visible)
  These are the highest priority targets for hunt agents.
  | Entry Point | Sink | Hop Count | Auth Seen? |
  |-------------|------|-----------|-----------|
  | [file:line] | [file:line] | [N] | No |

  ---

  ## Default Configuration Findings

  ### Features on by default that create risk:
  | Config File | Setting | Risk |
  |-------------|---------|------|

  ### Security controls absent from default config:
  | Config File | Missing Control | Risk Level |
  |-------------|----------------|-----------|

  ### Plaintext credentials or sensitive values found:
  | File | Line | Type |
  |------|------|------|

  ---

  ## Hunt Agent Instructions
  (pre-computed guidance based on this surface map)

  ### Highest priority chains to investigate:
  These have an entry point, a dangerous sink, and no visible
  auth check in between. Feed these to hunt-redteam first.

  1. [entry-point-file:line] → [sink-file:line]
     Entry type: [HTTP POST / MCP tool / queue / etc]
     Sink type: [deserialisation / SQL / etc]
     CVE class match: [CWE-N if matches cve-inventory.md]
     Why high priority: [one sentence]

  2. [repeat for top 5-10 chains]

  ### Recommended grep pass for CVE pattern hunter:
  (for hunt-redteam follow-up)
  Based on the sinks found, these patterns should be searched
  exhaustively across all trees:
  - [pattern]: found [N] times, [N] in non-test code

  ---

  ## Suspicious Targets For Deeper Analysis
  These are not findings. They are places where the mapper saw enough
  oddness to justify a deeper attacker pass.
  | File | Line | Why It Looks Interesting | Recommended Pass |
  |------|------|--------------------------|------------------|
  | [path] | [N] | [one sentence] | hunt-redteam |

  ---

  ## Research Hunches
  Preserve weak signals here so later passes can decide whether to burn
  time on them. Keep these short and clearly labeled as hunches.
  - [file:line] -- [odd seam, runtime behavior, or pattern mismatch]

## Completion Signal

When .hunt/attack-surface.md is written with Status: COMPLETE, output EXACTLY:
  SURFACE RECON COMPLETE
  Output: .hunt/attack-surface.md
  Search families completed: [N]
  Degraded families: [N]
  Failed or timed-out steps: [N]
  Entry points found: [N]
  Dangerous sinks found: [N]
  High-priority chains (no auth visible): [N]
  Default config findings: [N]
  READY FOR TEST GAP ANALYSER

If you must stop with a partial map already written, output EXACTLY:
  SURFACE RECON PARTIAL
  Output: .hunt/attack-surface.md
  Search families completed: [N]
  Degraded families: [N]
  Failed or timed-out steps: [N]
  Entry points found so far: [N]
  Dangerous sinks found so far: [N]
  Blocking gap summary: [one short sentence]
  NEXT ACTION: resume recon-surface-mapper and finish missing search families

## Rules
- Write ONLY to .hunt/attack-surface.md
- Never keep the map only in memory. Checkpoint it to
  .hunt/attack-surface.md as the run progresses.
- Treat absence of explicit "## Status: COMPLETE" as an incomplete recon.
- A partial map is valid only if it says PARTIAL and explains the covered
  and uncovered search families and module trees.
- Do not attempt to trace full data flows — that is the hunt-redteam's job.
  Your job is inventory and first-pass proximity analysis.
- "Auth Required: Unknown" is a valid entry. Do not skip entry points
  because you can't immediately determine auth status.
- The "High-value paths" table is the most important output.
  An entry point that has a dangerous sink within 5 files of it
  with no auth check in between belongs in that table even if
  you're not certain there's a real vulnerability.
  Treat it as a seed list for hunt agents, not as a filed finding.
- Suspicious Targets and Research Hunches are allowed and useful,
  but they must stay clearly separate from the factual inventory and
  must never be written as implied findings.
- Run on all specified module trees. Do not stop at first findings.
- Treat each search family as independent.
  A failed or slow step must be reported, then bypassed.
- Prefer a partial map with explicit gaps over a blocked run.
- If grep produces more than 50 results for a pattern, record the
  count and a representative sample — do not truncate silently.
"""
