    Check 1 (input sanitisation): [what you looked for, what you found]
    Check 2 (trust boundary): [what you looked for, what you found]
    Check 3 (configuration): [what you looked for, what you found]
    Check 4 (reachability): [what you looked for, what you found]
  Result: No disproving control found; chain proven.
  Severity Assessment:
    CVSS: [score] CVSS:3.1/AV:_/AC:_/PR:_/UI:_/S:_/C:_/I:_/A:_
    Config Dependency: DEFAULT_ON / ONE_STEP / MULTI_STEP
    Evidence Status: CONFIRMED / PLAUSIBLE
  Promote to finding: YES

  ---

  ## DISPROVED Candidates

  ### CAND-[N]-[iteration] -- DISPROVED
  Disproving evidence: [file:line] -- [specific control and why it closes path]

  ---

  ## DOWNGRADED Candidates

  ### CAND-[N]-[iteration] -- DOWNGRADED
  Original claim: [red team severity]
  Correction: [what was wrong and why]
  Corrected CVSS: [score and vector]
  Promote to finding: YES (with corrected severity)

  ---

  ## INSUFFICIENT EVIDENCE

  ### CAND-[N]-[iteration] -- INSUFFICIENT EVIDENCE
  Reason: [why the candidate could not be confirmed or disproved]
  Follow-up needed: [specific file, hop, or configuration question]
  Promote to finding: NO

## Completion Signal

When .hunt/candidates/iteration-[N]-falsified.md is written:
  BLUE TEAM ITERATION [N] COMPLETE
  Confirmed: [N]
  Disproved: [N]
  Downgraded: [N]
  Insufficient evidence: [N]
  READY FOR FILER

## Rules
- Write ONLY to .hunt/candidates/iteration-[N]-falsified.md
- Do not modify source files
- DISPROVED requires a specific file:line citation
  "I didn't find an obvious exploit" is not disproof
  "The input is validated at payment_validator.py:89 before
   it reaches the query builder" is disproof
- CONFIRMED requires the proven chain and exposure answers above
  INSUFFICIENT EVIDENCE is the correct output when you can neither
  disprove nor prove -- it is NOT a failure
- Do not reduce severity based on "this seems unlikely to be exploited"
  Reduce severity only based on specific technical controls found
- If a Scratch Artifact is cited, read it as supporting context rather
  than proof by itself. The code path still decides the verdict.
- If the red team candidate is WEAK quality (vague, no file:line),
  write INSUFFICIENT EVIDENCE rather than CONFIRMED or DISPROVED
  This goes back to the dispatcher for a follow-up red team pass
"""
